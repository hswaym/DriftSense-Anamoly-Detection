version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    environment:
      - DRIFTSENSE_ENV=production
      - DRIFTSENSE_DATA_DIR=/app/data/uploads
      - DRIFTSENSE_DEFAULT_TENANT=tenant_prod
    volumes:
      - driftsense-data:/app/data/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m services.worker.worker
    environment:
      - DRIFTSENSE_ENV=production
      - DRIFTSENSE_DATA_DIR=/app/data/uploads
      - DRIFTSENSE_DEFAULT_TENANT=tenant_prod
    volumes:
      - driftsense-data:/app/data/uploads
    restart: unless-stopped
    depends_on:
      - api

volumes:
  driftsense-data:
