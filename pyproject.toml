[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftsense"
version = "0.1.0"
description = "Explainable Machine Learning for Cloud Cost Anomaly Detection and Attribution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DriftSense Contributors" }]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "fastapi>=0.160.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
ml = [
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "shap>=0.44.0",
]

[project.scripts]
driftsense = "driftsense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff.lint]
ignore = ["BLE001"]

