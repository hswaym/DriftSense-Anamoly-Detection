# DriftSense — Phase 10 Controlled Experiments & Ablation Configuration
# Standard: FinOps FOCUS 1.0 / 1.3

protocol:
  path: "docs/experiment_protocol.md"
  sha256: "b3d6945e90c46d76310241a2168c7e9e8e8e506589d17e4cb878d547e47dfe7e"

dataset:
  train_path: "data/splits/train_features.csv"
  val_path: "data/splits/val_features.csv"
  # Note: Test split (data/splits/test_features.csv) is strictly quarantined and excluded from Phase 10
  target_col: "EffectiveCost"
  time_col: "ChargePeriodStart"
  service_col: "ServiceName"
  val_labels_path: "runs/run_20261019_174627_660563/val_anomaly_labels.json"
  val_events_path: "runs/run_20261019_174627_660563/val_operational_events.json"

experiment:
  seeds:
    - 42
    - 123
    - 999
  models:
    xgboost:
      n_estimators: 100
      max_depth: 5
      learning_rate: 0.05
      log_transform: true
    detector:
      window_size: 24
      k_std: 3.0
    attributor:
      lookback_hours: 3.0
      decay_halflife_hours: 1.0

output:
  results_dir: "results/ablation"
  metrics_path: "results/ablation/ablation_metrics.json"
  summary_table_path: "results/ablation/ablation_summary.csv"

runtime:
  seed: 42
  phase: "PHASE_10"
  stage: "controlled_experiments"
